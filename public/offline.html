<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>สานไทย — ออฟไลน์</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2B1B41; color: #fdf8f0; font-family: sans-serif; text-align: center; padding: 16px; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { color: #d4af37; font-size: 1.5rem; }
      button { background: #d4af37; color: #1d122d; border: 0; border-radius: 999px; padding: 10px 24px; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>คุณออฟไลน์อยู่</h1>
      <p>You're offline. Check your connection and try again.</p>
      <button onclick="location.reload()">ลองอีกครั้ง / Retry</button>
    </main>
  </body>
</html>
